[project]
name = "remote-vscode-launcher"
version = "0.2.5"
description = "Launch your local Windows VS Code onto a remote Linux directory over SSH via an HTTP trigger."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "tayaee" }]
requires-python = ">=3.10"
keywords = ["vscode", "ssh", "remote", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Networking",
]
dependencies = ["click>=8.1"]

[project.urls]
Homepage = "https://github.com/tayaee/remote-vscode-launcher"
Repository = "https://github.com/tayaee/remote-vscode-launcher.git"
Issues = "https://github.com/tayaee/remote-vscode-launcher/issues"

[project.scripts]
rvl-server = "remote_vscode_launcher.server:main"
rvl = "remote_vscode_launcher.client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remote_vscode_launcher"]

[tool.hatch.build.targets.sdist]
exclude = [".git", ".github", "tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
